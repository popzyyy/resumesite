{% extends 'main.html' %}
{% load static %}
{% block content %}
    <style>
        .form-inline {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
        }

        .form-inline input,
        .form-inline select {
            display: inline-block;
            width: auto !important;
            max-width: 12rem;
        }

        body {
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 125vh
        }

        .tabs {
            width: min(1100px, 112vw);
            border-radius: 18px;

            overflow: hidden
        }

        .tablist {
            display: flex;
            gap: .25rem;
            background: rgba(255, 255, 255, .04);
            padding: .4rem;
            border-bottom: 1px solid rgba(255, 255, 255, .06);

        }

        .tab {
            appearance: none;
            background: transparent;
            color: rgba(0, 0, 0, 0.79);
            padding: .8rem 1rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(143, 143, 143, 0.78);
        }

        .tab[aria-selected="true"] {
            outline: 2px solid transparent;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .06)
        }

        .tab:focus-visible {

            outline-offset: 2px;
            border-radius: 12px
        }

        .panel {
            display: none;
            padding: 1.25rem 1.2rem 1.5rem
        }

        .panel[hidden] {
            display: none
        }

        .panel:not([hidden]) {
            display: block
        }

        .grid {
            display: grid;
            gap: .8rem;
            grid-template-columns:repeat(auto-fit, minmax(220px, 1fr))
        }

        .card {
            background: rgba(152, 152, 152, 0.38);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: 14px;
            padding: 1rem
        }

        a.btn {
            display: inline-block;
            margin-top: .6rem;
            padding: .55rem .8rem;
            background: rgba(152, 152, 152, 0.38);
            color: #646363;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700
        }

        button {
            display: inline-block;
            margin-top: .6rem;
            padding: .55rem .8rem;
            background: rgba(8, 46, 234, 0.98) !important;
            color: #646363;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700


        }




    </style>

    <form id="form-container" method="POST">
        {% csrf_token %}
        <div id="banner-wrapper">
            <div id="banner" class="box container">
                <div class="row">
                    <section class="box feature">
                        <section class="tabs">

                            <div class="tablist" role="tablist" aria-label="Pop Menu">
                                <button class="tab" type="button" role="tab" aria-selected="true"
                                        aria-controls="panel-distance" id="tab-distance">Distance
                                </button>
                                <button class="tab" type="button" role="tab" aria-selected="false"
                                        aria-controls="panel-temp" id="tab-temp">Temperature
                                </button>
                                <button class="tab" type="button" role="tab" aria-selected="false"
                                        aria-controls="panel-volume" id="tab-volume">Volume
                                </button>
                            </div>

                            <div id="panel-distance" class="panel" role="tabpanel" tabindex="0"
                                 aria-labelledby="tab-distance">
                                <div class="grid">
                                    <div class="card">
                                        <h3>Distance From</h3>
                                        <div class="form-inline">
                                            {{ distanceform.distance_from }}
                                            {{ distanceform.unit_from }}
                                        </div>
                                    </div>

                                    <div class="card">
                                        <h3>Distance To</h3>
                                        <div class="form-inline">
                                            <input type="text" name="distance_to" value="{{ distance_to }}"
                                                   style="width: 8em;" required="" id="id_distance_to" readonly>

                                            {{ distanceform.unit_to }}
                                        </div>

                                    </div>
                                </div>
                            </div>
                            <div id="panel-temp" class="panel" role="tabpanel" tabindex="0"
                                 aria-labelledby="tab-temp" hidden>
                                <div class="grid">
                                    <div class="card">
                                        <h3>Temperature From</h3>
                                        <p></p>

                                    </div>
                                    <div class="card">
                                        <h3>Temperature To</h3>
                                        <p></p>

                                    </div>
                                </div>
                            </div>

                            <div id="panel-volume" class="panel" role="tabpanel" tabindex="0"
                                 aria-labelledby="tab-volume" hidden>
                                <div class="grid">

                                    <div class="card">
                                        <h3>Volume From</h3>
                                        <p></p>

                                    </div>
                                    <div class="card">
                                        <h3>Volume To</h3>
                                        <p></p>

                                    </div>
                                </div>

                            </div>

                            <button class="button" type="submit">CONVERT THAT MF UNIT OF MEASUREMENT LFG!!! 🤓🤓🤓🤓</button>

                        </section>
                    </section>
                </div>
            </div>
        </div>

    </form>
    <script>
        const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
        const panels = Array.from(document.querySelectorAll('[role="tabpanel"]'));

        function activateTab(tab) {
            tabs.forEach(t => t.setAttribute('aria-selected', t === tab ? 'true' : 'false'));
            panels.forEach(p => {
                p.hidden = (p.id !== tab.getAttribute('aria-controls'));
            });
            const activePanel = document.getElementById(tab.getAttribute('aria-controls'));
            activePanel.focus({preventScroll: true});
        }

        tabs.forEach((tab, idx) => {
            tab.addEventListener('click', () => activateTab(tab));


        });

        const hashMap = {
            '#home': 'tab-home',
            '#products': 'tab-products',
            '#about': 'tab-about',
            '#settings': 'tab-settings'
        };

    </script>


{% endblock %}
