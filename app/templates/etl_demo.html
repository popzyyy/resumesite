{% extends 'main.html' %}
{% load static %}
{% block content %}
    <style>
        .formset-container {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 20px;
        }

        .textarea {
            width: 100%;
            height: 15em;
            margin: 2px;
            padding: 2em;
            border: 0;
        }

        #id_text {
            outline: 3px solid black;
            width: 100%;
            height: 100%;
        }
    </style>

    <div id="banner-wrapper">
        <div id="banner" class="box container">

            <h2>ETL Example </h2>

            <div class="row">
                <div class="col-12">

                    <form id="form-container" class="row" method="POST">
                        {% csrf_token %}
                        {{ csv_upload.errors }}
                        {{ csv_upload.file_uploads }}
                        <div class="row">
                            <div style="padding-top: 4em; display: inline-block;">
                                <button class="button" type="submit">Find Out</button>
                            </div>

                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

{% endblock %}
